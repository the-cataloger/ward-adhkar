name: Android APK - Ward
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test and assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ward-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
